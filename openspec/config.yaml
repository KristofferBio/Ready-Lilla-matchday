schema: spec-driven

context: |
  Language: Norwegian
  All artifacts must be written in Norwegian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Kampstøtte for fotballtrenere, React 19, Vite 8, Tailwind CSS 4 og Firebase Firestore.
  Deployment: GitHub Pages under /Ready-Lilla-matchday/; mobilbruk og dårlig dekning er sentralt.
  Existing code: installerbar PWA, trykk-/dra-bytter, lokal lagadministrasjon,
    vedvarende synkkø, sanntidsabonnement og samlet lagring av bytter.
  Limits: laglisten er lokal; samtidig redigering er ikke konfliktfri;
    full mobil-/Firebase-verifikasjon gjenstår; nettleserlagring er ikke sikkerhetskopi.
  Preserve existing team IDs and match data. Never test writes against a real match.
  Planning does not authorize implementation, production changes, commits or deployment.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
